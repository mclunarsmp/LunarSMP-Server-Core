# Toggles whether chat messages should be sent.
Enabled: true

Public:
  # Whether public chat messages should be sent to the server's console.
  Send-To-Console: true
  First-Join:
    1:
      Permission: cjm.default
      Radius: -1
      Max-Players: -1
      Messages:
        1:
        - "&a%name% đã tham gia server lần đầu tiên! &8(&a#%uniquejoins%&8)"
  Join:
    1:
      Permission: cjm.default
      Messages:
        1:
        - "&x&F&F&F&F&F&F[&x&0&0&F&F&0&0+&x&F&F&F&F&F&F] &a%name% &7"
  Quit:
    1:
      Permission: cjm.default
      Messages:
        1:
        - "&x&F&F&F&F&F&F[&x&F&F&0&0&0&0-&x&F&F&F&F&F&F] &a%name% &7"

